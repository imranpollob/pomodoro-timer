name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux:
    # Pin the distro so python3-tk is guaranteed to match Python 3.12.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb

      - name: Install locked Python dependencies
        run: uv sync --locked --python /usr/bin/python3.12

      - name: Build .deb package
        run: bash build_deb.sh

      - name: Install and smoke-test .deb package
        run: |
          sudo dpkg --install pomodoro-timer_amd64.deb
          set +e
          timeout 10s xvfb-run --auto-servernum /usr/bin/pomodoro
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "The installed application exited unexpectedly with status $status" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: "*.deb"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: .\build_windows.bat
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/pomodoro-timer-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build app bundle
        run: uv run pyinstaller --clean --noconfirm pomodoro.spec

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Pomodoro.app Pomodoro-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Pomodoro-macOS.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-deb/*.deb
            artifacts/windows-installer/*.exe
            artifacts/macos-app/*.zip
