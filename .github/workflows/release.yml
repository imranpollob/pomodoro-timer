name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build .deb package
        run: bash build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: "*.deb"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: .\build_windows.bat
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/pomodoro-timer-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build app bundle
        run: uv run pyinstaller --clean --noconfirm pomodoro.spec

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Pomodoro.app Pomodoro-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Pomodoro-macOS.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-deb/*.deb
            artifacts/windows-installer/*.exe
            artifacts/macos-app/*.zip
