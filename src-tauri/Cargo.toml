[package]
name = "pomodoro-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "pomodoro_desktop_runtime"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
focus-core = { path = "../crates/focus-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
semver = "1"
uuid.workspace = true
sha2 = "0.11"
base64 = "0.23"
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }
zbus = { version = "5.19", features = ["blocking-api"] }

[features]
smoke-test = []
custom-protocol = ["tauri/custom-protocol"]
